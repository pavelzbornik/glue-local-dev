# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0 # Use the latest tag from the repository
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  # Add black for Python code formatting
  - repo: https://github.com/psf/black
    rev: 26.10.1 # Use the latest stable version of Black
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    # Add isort for sorting imports in Python

    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
  - repo: https://github.com/PyCQA/pydocstyle
    # Add pydocstyle for checking docstrings

    rev: 6.3.0 # Use the latest stable version of pydocstyle
    hooks:
      - id: pydocstyle
        files: ^app/
  - repo: https://github.com/adrienverge/yamllint
    # Lint: YAML

    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["-d {extends: relaxed, rules: {line-length: disable}}", "-s"]
        files: \.(yaml|yml)$
  - repo: https://github.com/google/yamlfmt
    rev: v0.10.0
    hooks:
      - id: yamlfmt
        # - repo: https://github.com/shellcheck-py/shellcheck-py
  - repo: https://github.com/codespell-project/codespell
    # Lint: Markdown

    # rev: v0.10.0.1
    # hooks:
    #   - id: shellcheck
    #     args: ["-x"]
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
          # args: ["--ignore-words-list='dne'"]
